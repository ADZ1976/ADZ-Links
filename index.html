<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff4b00">
<meta name="description" content="ADZ – Apps, LinkedIn und Website auf einen Blick.">
<title>ADZ | Unsere Links</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202020;background:#f4f4f4;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,490px);background:white;border-radius:20px;box-shadow:0 10px 38px #00000012;padding:32px 26px}
.brand{background:#111;border-radius:12px;padding:18px;margin-bottom:24px}
.brand img{display:block;width:100%;height:auto;max-height:110px;object-fit:contain}
h1{font-size:1.45rem;line-height:1.3;margin:0 0 8px}p{color:#606060;line-height:1.5;margin:0 0 24px}
nav{display:grid;gap:12px}a.link{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #e7e7e7;border-radius:12px;padding:17px 18px;text-decoration:none;color:#222;font-weight:700;transition:background .15s,border-color .15s}
a.link:hover,a.link:focus-visible{background:#fff4ef;border-color:#ff4b00;outline-offset:3px}
a.link:after{content:'↗';font-size:1.3rem;color:#ff4b00}footer{font-size:.8rem;text-align:center;color:#777;margin-top:26px}
@media(max-width:400px){main{padding:24px 18px}body{padding:12px}}
</style>
</head>
<body><main>
<div class="brand"><img src="adz-logo.png" alt="BKW Engineering ADZ"></div>
<h1>ADZ – Alle Links auf einen Blick</h1>
<p>Entdecken Sie unsere App, unser LinkedIn-Profil und unsere Website.</p>
<nav id="links" aria-label="ADZ Links"></nav>
<footer>ADZ · BKW Engineering</footer>
</main>
<script>
// LINKS BEARBEITEN: Einträge ergänzen, entfernen oder umbenennen.
// Nach dem Hochladen der geänderten Datei bleibt der QR-Code unverändert.
const links = [
  { titel: 'Apple App Store', url: 'https://apps.apple.com/ch/app/adz/id1634024819' },
  { titel: 'Google Play Store', url: 'https://play.google.com/store/apps/details?id=ch.arcade.ADZapp&pcampaignid=web_share' },
  { titel: 'LinkedIn', url: 'https://www.linkedin.com/company/aicher-de-martin-zweng-ag/' },
  { titel: 'ADZ Website', url: 'https://www.adz.ch/de' }
];
const nav = document.getElementById('links');
for (const item of links) {
  const a = document.createElement('a');
  a.className = 'link';
  a.textContent = item.titel;
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  nav.appendChild(a);
}
</script></body></html>
