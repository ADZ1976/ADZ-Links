<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ADZ – Alle Links auf einen Blick</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#202124}
.container{width:100%;max-width:460px;text-align:center}
.brand{margin:0 auto 22px;max-width:310px;background:transparent}
.brand img{display:block;width:100%;height:auto}
h1{font-size:25px;line-height:1.3;margin:0 0 28px}
.links{display:grid;gap:13px}
.link{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:19px 20px;border:1px solid #dedfe3;border-radius:13px;background:#fff;color:#202124;text-decoration:none;font-size:17px;font-weight:600;text-align:left;transition:transform .2s,border-color .2s}
.link:hover{transform:translateY(-2px);border-color:#f26a21}
.link svg{width:21px;height:21px;flex-shrink:0;fill:none;stroke:#f26a21;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-color-scheme:dark){body{background:#181a1e;color:#f5f5f5}.link{background:#292c32;border-color:#42454b;color:#fff}}
</style>
</head>
<body>
<main class="container">
<div class="brand"><img src="adz-logo.png" alt="BKW Engineering ADZ"></div>
<h1>ADZ – Alle Links auf einen Blick</h1>
<nav class="links" aria-label="ADZ Links">
<a class="link" href="https://apps.apple.com/ch/app/adz/id1634024819" target="_blank" rel="noopener noreferrer"><span>Apple App Store</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
<a class="link" href="https://play.google.com/store/apps/details?id=ch.arcade.ADZapp&amp;pcampaignid=web_share" target="_blank" rel="noopener noreferrer"><span>Google Play Store</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
<a class="link" href="https://www.linkedin.com/company/aicher-de-martin-zweng-ag/" target="_blank" rel="noopener noreferrer"><span>LinkedIn</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
<a class="link" href="https://www.adz.ch/de" target="_blank" rel="noopener noreferrer"><span>ADZ Website</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
</nav>
</main>
</body>
</html>
